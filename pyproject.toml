[project]
name = "safespend"
version = "0.1.0"
description = "Payment firewall and AML monitoring for AI agents (mock money only)."
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.4",
    "itsdangerous==2.2.0",
    "click==8.5.1",
    "blinker==1.9.0",
    "requests==2.34.2",
    "urllib3==2.8.0",
    "idna==3.20",
    "certifi==2026.10.23",
    "charset-normalizer==3.5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.uv]
# Vercel installs dependencies with uv; this is an app, not a package to build.
package = false
